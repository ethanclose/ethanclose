<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Ethan Close</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Ethan Close</a>
    <nav class="nav" aria-label="Main">
      <a href="images.html">Photos</a>
      <a href="videos.html">Videos</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
      <a href="contact.html#signup" class="nav__signup" data-signup-trigger>Sign Up</a>
    </nav>
  </header>

  <main>
    <div class="wrap contact">
      <section>
        <dl>
          <dt>Email</dt>
          <dd><a href="mailto:hello@ethanclose.com">hello@ethanclose.com</a></dd>
          <dt>Based in</dt>
          <dd>Oakland, California</dd>
        </dl>
      </section>

      <div class="contact__side">
        <section id="message">
          <h2>Send a message</h2>
          <div class="fs-status" data-fs-success role="status"></div>
          <div class="fs-status" data-fs-error role="alert"></div>
          <form id="contact-form" class="message-form" novalidate>
            <label for="cf-name">Name</label>
            <input type="text" id="cf-name" name="name" autocomplete="name" data-fs-field>
            <span class="fs-error" data-fs-error="name"></span>

            <label for="cf-email">Email</label>
            <input type="email" id="cf-email" name="email" autocomplete="email" required data-fs-field>
            <span class="fs-error" data-fs-error="email"></span>

            <label for="cf-message">Message</label>
            <textarea id="cf-message" name="message" rows="5" required data-fs-field></textarea>
            <span class="fs-error" data-fs-error="message"></span>

            <input type="text" name="_gotcha" class="signup__trap" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button class="btn" type="submit" data-fs-submit-btn>Send</button>
          </form>
        </section>

        <section id="signup">
          <h2>Mailing list</h2>
          <p>New photos and videos, now and then. No spam.</p>
          <div data-signup-form></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">&copy; 2026 Ethan Close</footer>
  <script src="assets/js/site.js"></script>
  <script>
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    formspree('initForm', { formElement: '#contact-form', formId: 'maeowoal' });
  </script>
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
</body>
</html>
