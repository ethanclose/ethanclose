<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ethan close</title>
  <meta name="description" content="Fotografía y video de ethan close.">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('ec:theme'); } catch { /* storage unavailable */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="alternate" hreflang="en" href="/index.html">
  <link rel="alternate" hreflang="es" href="/es/index.html">
  <link rel="alternate" hreflang="x-default" href="/index.html">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">ethan close</a>
    <nav class="nav" aria-label="Principal">
      <a href="images.html">fotos</a>
      <a href="videos.html">videos</a>
      <a href="about.html">acerca de</a>
      <a href="contact.html">contacto</a>
      <a href="contact.html#signup" class="nav__signup" data-signup-trigger>suscribirse</a>

    </nav>
  </header>

  <main class="home">
    <div class="wrap">
      <section class="cards" aria-label="Secciones">
        <div class="cards__ring">
          <a class="card" href="images.html" aria-label="Fotos" style="--i: 0">
            <img src="/assets/images/Night Herons/PXL_20260313_165930023.jpg" alt="" loading="eager" decoding="async">
          </a>
          <a class="card card--about" href="about.html" aria-label="Acerca de" style="--i: 1">
            <div class="card__frames">
              <img src="/assets/images/Pumpkin Feast with Mancha/PXL_20261026_021657661.jpg" alt="" loading="lazy" decoding="async">
              <img src="/assets/images/Pumpkin Feast with Mancha/PXL_20261026_021658519.jpg" alt="" loading="lazy" decoding="async">
            </div>
          </a>
          <a class="card" href="contact.html" aria-label="Contacto" style="--i: 2">
            <img src="/assets/home/seagull.jpg" alt="" loading="lazy" decoding="async">
          </a>
          <a class="card card--video" href="videos.html" aria-label="Videos" style="--i: 3">
            <video class="card__video" src="/assets/videos/short-crow-staging-web.mp4" poster="/assets/videos/short-crow-staging-poster.jpg" muted autoplay loop playsinline preload="auto" aria-hidden="true" tabindex="-1"></video>
          </a>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">&copy; 2026 ethan close</footer>
  <div class="page-tools">
        <div class="lang-switch" role="group" aria-label="Idioma">
          <a href="../index.html" lang="en" hreflang="en" data-lang-link="en">EN</a>
          <span aria-hidden="true">|</span>
          <a href="index.html" lang="es" hreflang="es" aria-current="true">ES</a>
        </div>
        <button class="theme-toggle" type="button" aria-label="Cambiar al modo oscuro" aria-pressed="false" title="Cambiar al modo oscuro">
          <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
        </button>
  </div>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/site.js"></script>
  <script src="/assets/js/home.js"></script>
</body>
</html>
